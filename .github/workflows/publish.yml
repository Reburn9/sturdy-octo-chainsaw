name: Publish release and container
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      image: ${{ steps.metadata.outputs.image }}
      publish: ${{ steps.existing.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: metadata
        name: Read and validate release metadata
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Use a stable semantic version for this workflow.')
          if not pathlib.Path(f'docs/releases/v{version}.md').is_file():
              raise SystemExit('Write release notes for this version first.')
          sha = subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()
          values = {'version':version, 'tag':f'v{version}', 'source_sha':sha,
                    'image':'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
          PY
      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  package:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build Python distributions
        run: |
          python -m pip install -r requirements-dev.txt build
          python -m build
      - name: Build, validate, and publish container
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.revision=$SOURCE_SHA" --label "org.opencontainers.image.version=$VERSION" -t "$IMAGE:$VERSION" .
          docker run --rm --entrypoint python "$IMAGE:$VERSION" -c 'import django, psycopg; print("Container dependencies verified")'
          docker push "$IMAGE:$VERSION"
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" > dist/container-image.txt
      - name: Verify release assets and checksums
        run: python scripts/check_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          retention-days: 7
  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/container-image.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "LabelLedger $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --latest

{% extends 'ledger/base.html' %}{% block breadcrumb %}{{ title }}{% endblock %}
{% block content %}<a class="back-link" href="{% if dataset %}{% url 'dataset' dataset.pk %}{% else %}{% url 'dashboard' %}{% endif %}">← Back to workspace</a><section class="page-heading"><div><p class="eyebrow">{{ eyebrow }}</p><h1>{{ title }}</h1><p class="subtitle">{{ description }}</p></div></section><section class="panel form-panel"><form method="post" class="stack-form" data-submit-form>{% csrf_token %}{{ form.as_p }}<button class="button primary" type="submit">{{ button }}</button></form></section>{% endblock %}

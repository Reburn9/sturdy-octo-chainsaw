{% if page.has_other_pages %}<nav class="pagination" aria-label="Pagination"><span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="button secondary small-button" href="?page={{ page.previous_page_number }}&q={{ query|urlencode }}&state={{ state|urlencode }}">← Previous</a>{% endif %}{% if page.has_next %}<a class="button secondary small-button" href="?page={{ page.next_page_number }}&q={{ query|urlencode }}&state={{ state|urlencode }}">Next →</a>{% endif %}</div></nav>{% endif %}

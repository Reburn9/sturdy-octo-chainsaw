[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "labelledger"
version = "0.1.0"
description = "A dataset review workbench with independent labels, agreement metrics, and an audit trail."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Django>=5.2,<5.3", "whitenoise>=6.8,<7", "gunicorn>=23,<26"]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1", "coverage>=7.6,<8"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["config*", "ledger*"]

[tool.setuptools.package-data]
ledger = ["templates/**/*.html", "static/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["ledger/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["ledger"]
omit = ["*/migrations/*", "*/tests/*", "*/management/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85

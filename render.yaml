# Free initial deployment. Render's free PostgreSQL database expires after 30 days.
databases:
  - name: labelledger-db
    databaseName: labelledger
    user: labelledger
    plan: free
    region: frankfurt
    ipAllowList: []
services:
  - type: web
    name: labelledger
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/Reburn9/sturdy-octo-chainsaw
    branch: main
    buildCommand: bash scripts/render-build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_TRUST_PROXY
        value: "1"
      - key: DJANGO_SECRET_SEED
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: labelledger-db
          property: connectionString
      - key: DATABASE_SSLMODE
        value: require
      - key: DJANGO_SUPERUSER_USERNAME
        value: owner
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
